<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Join Server Minecraft</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --green: #4ade80;
      --dark-green: #16a34a;
      --bg: #0a0f0a;
      --card: #111a11;
      --border: #1f3a1f;
      --text: #e8f5e8;
      --muted: #6b8f6b;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Nunito', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* Grid background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(74,222,128,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(74,222,128,0.04) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
    }

    /* Glow orb */
    body::after {
      content: '';
      position: fixed;
      top: -200px;
      left: 50%;
      transform: translateX(-50%);
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(74,222,128,0.12) 0%, transparent 70%);
      pointer-events: none;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 48px 40px;
      max-width: 420px;
      width: 90%;
      text-align: center;
      position: relative;
      box-shadow: 0 0 60px rgba(74,222,128,0.08), 0 20px 60px rgba(0,0,0,0.5);
      animation: fadeUp 0.6s ease both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(30px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .icon {
      font-size: 56px;
      display: block;
      margin-bottom: 16px;
      animation: bounce 2s ease-in-out infinite;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    h1 {
      font-family: 'Press Start 2P', monospace;
      font-size: 13px;
      color: var(--green);
      line-height: 1.8;
      margin-bottom: 8px;
      text-shadow: 0 0 20px rgba(74,222,128,0.5);
    }

    .subtitle {
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 32px;
    }

    .server-info {
      background: rgba(74,222,128,0.05);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px 20px;
      margin-bottom: 28px;
      text-align: left;
    }

    .server-info .label {
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 4px;
    }

    .server-info .value {
      font-family: 'Press Start 2P', monospace;
      font-size: 10px;
      color: var(--green);
    }

    .btn {
      display: block;
      width: 100%;
      padding: 18px;
      background: var(--green);
      color: #0a0f0a;
      font-family: 'Press Start 2P', monospace;
      font-size: 11px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s;
      box-shadow: 0 4px 0 var(--dark-green), 0 8px 20px rgba(74,222,128,0.25);
      position: relative;
      top: 0;
    }

    .btn:hover {
      background: #6ee7a0;
      top: 2px;
      box-shadow: 0 2px 0 var(--dark-green), 0 6px 16px rgba(74,222,128,0.25);
    }

    .btn:active {
      top: 4px;
      box-shadow: 0 0px 0 var(--dark-green);
    }

    .note {
      margin-top: 20px;
      font-size: 12px;
      color: var(--muted);
      line-height: 1.6;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--green);
      margin-bottom: 24px;
    }

    .dot {
      width: 8px;
      height: 8px;
      background: var(--green);
      border-radius: 50%;
      animation: pulse 1.5s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.8); }
    }
  </style>
</head>
<body>
  <div class="card">
    <span class="icon">⛏️</span>
    <h1>JOIN SERVER</h1>
    <p class="subtitle">Bedrock Edition</p>

    <div class="status">
      <div class="dot"></div>
      Server Online
    </div>

    <div class="server-info">
      <div class="label">IP Address</div>
      <div class="value">basic.raehost.com</div>
    </div>
    <div class="server-info">
      <div class="label">Port</div>
      <div class="value">19243</div>
    </div>

    <a class="btn" href="minecraft://connect/?serverIp=basic.raehost.com&serverPort=19243">
      ▶ KLIK UNTUK JOIN
    </a>

    <p class="note">
      Khusus <strong>Bedrock Edition</strong> (Android, iOS, Windows, Console).<br/>
      Pastikan Minecraft sudah terinstall.
    </p>
  </div>
</body>
</html>
